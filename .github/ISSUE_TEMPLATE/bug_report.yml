name: Bug Report
description: Report an issue with tool-guardian
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a bug. Please include specific details to help us reproduce and fix the issue."

  - type: input
    id: version
    attributes:
      label: "Version"
      description: "npm and/or PyPI version"
      placeholder: "0.3.0-alpha.5 (npm) / 0.3.0 (PyPI)"
    validations:
      required: true

  - type: dropdown
    id: install_path
    attributes:
      label: "Installation Method"
      description: "How did you install tool-guardian?"
      options:
        - "DSH plugin (npm - dsh-tool-guardian)"
        - "MCP router (PyPI - tool-guardian)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - "Windows"
        - "macOS"
        - "Linux"
        - "Other"

  - type: input
    id: versions
    attributes:
      label: "Python and Node Versions"
      description: "Output of 'python --version' and 'node --version'"
      placeholder: "Python 3.9.8, Node 22.19.0"

  - type: input
    id: model_backend
    attributes:
      label: "Model and Backend"
      description: "Model name, context window size, and LLM backend"
      placeholder: "llama2 13B on LM Studio, context 4096"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: "What Happened"
      description: "What did you observe? Include error messages or unexpected behavior."
      placeholder: "Tool definitions are not being hidden from context..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "Tool definitions should be replaced with generic placeholders..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce the issue?"
      placeholder: |
        1. Configure tool-guardian with 3 MCP servers
        2. Send a request to the router
        3. Observe that...

  - type: textarea
    id: logs
    attributes:
      label: "Logs and Output"
      description: "Error messages or diagnostic output. Do not paste your configuration file. Remove any API keys or sensitive data."
      render: "text"
      placeholder: "Paste error messages, tracebacks, or log output here"

  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostic Output"
      description: "Output of '/toolguardian' in DSH"
      placeholder: "Paste the output here"
