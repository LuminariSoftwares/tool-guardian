name: Bug Report
description: Something does not work as the README says it should
title: "[Bug] "
labels: ["bug", "needs-info"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. This is a one-person, best-effort project: you will get an
        acknowledgement within a day; reproducing and fixing takes longer, and the issue will say what is
        happening. See [SUPPORT.md](https://github.com/LuminariSoftwares/tool-guardian/blob/main/SUPPORT.md).

        Do not paste your config file or any API key. Do not report security problems here; use the
        private vulnerability link on the issue chooser.

  - type: input
    id: version
    attributes:
      label: "Version"
      description: "The output of `tool-guardian --version`"
      placeholder: "0.8.0"
    validations:
      required: true

  - type: dropdown
    id: install_path
    attributes:
      label: "Installation Method"
      description: "How did you install tool-guardian?"
      options:
        - "MCP router (PyPI - tool-guardian)"
        - "DSH plugin (npm - dsh-tool-guardian)"
        - "Docker"
        - "Other"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: "Operating system"
      description: "Name and version"
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: "Python version"
      description: "The output of `python --version`"
      placeholder: "Python 3.11.9"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: "The exact command"
      description: "What you ran, exactly as typed (or the client and the step that failed)."
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: "The full output"
      description: "All of it, not a summary. Remove any API keys or personal data first."
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What you expected"
      description: "What should have happened instead?"
    validations:
      required: true

  - type: input
    id: model_backend
    attributes:
      label: "Model and backend (optional)"
      description: "Model name, context window size and LLM backend, if it matters here"
      placeholder: "qwen3-coder:30b on Ollama, context 32768"

  - type: checkboxes
    id: quick_start
    attributes:
      label: "Before you submit"
      options:
        - label: "I ran the quick start as written"
          required: true
