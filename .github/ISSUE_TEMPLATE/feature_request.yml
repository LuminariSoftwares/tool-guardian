name: Feature Request
description: Suggest an enhancement to tool-guardian
title: "[Enhancement] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Opening one does not promise a timeline: the answer may be
        "later" or "not here", and it will come with the reason. See
        [SUPPORT.md](https://github.com/LuminariSoftwares/tool-guardian/blob/main/SUPPORT.md)
        for what this project will not do.

  - type: textarea
    id: goal
    attributes:
      label: "What you are trying to do"
      description: "The task or problem, not the feature."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: "What you tried"
      description: "Commands, config or workarounds, and where they fell short."
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: "What would change"
      description: "What you would be able to do, or what would get better, if this existed. Numbers help."
    validations:
      required: true
