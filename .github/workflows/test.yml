name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag: a tag is mutable, and a moved
# `v4` would run code nobody reviewed with this repo's token. The comment names the release.
jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          # Every version the package claims to support, on the cheapest runner.
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --no-package-lock --legacy-peer-deps
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  node:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the bundle's bridge and setup start the Python router
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --no-package-lock --legacy-peer-deps
      - run: npm run check
      - run: npm run test:node
      - run: node tests/dsh_smoke.mjs
      - run: node tests/probe_dsh_mvp.mjs
      - run: node tests/probe_dsh_loopguard.mjs
      - run: node tests/probe_recall_line.mjs
      - run: node tests/probe_setup.mjs

  docker:
    name: docker (build + stdio tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t tool-guardian:ci .
      # The README's own `docker run -i` invocation, answered over stdio: the image has to
      # start, complete the MCP handshake and list its router tools. A Dockerfile that builds
      # and then fails on import (a module added to pyproject.toml but not to a COPY line)
      # passes `docker build` and fails here.
      - name: Speak MCP to the image over stdio
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize",
               "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                          "clientInfo": {"name": "ci", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}},
          ]
          run = subprocess.run(["docker", "run", "-i", "--rm", "tool-guardian:ci"],
                               input="".join(json.dumps(m) + "\n" for m in requests),
                               capture_output=True, text=True, timeout=180)
          print(run.stderr[-2000:], file=sys.stderr)
          replies = {m["id"]: m for m in map(json.loads, run.stdout.splitlines()) if "id" in m}
          assert replies[1]["result"]["serverInfo"]["name"] == "tool-guardian", replies[1]
          names = sorted(t["name"] for t in replies[2]["result"]["tools"])
          print("tools/list:", names)
          for required in ("list_capabilities", "describe_tool", "call_tool"):
              assert required in names, (required, names)
          PY
