name: release

# Publishes PyPI `tool-guardian` and npm `dsh-tool-guardian` when a GitHub Release is published,
# by trusted publishing: each registry trusts this workflow file in this repository and hands the
# job a short-lived OIDC credential, and both uploads carry signed provenance pointing at the
# commit. No stored registry credential exists anywhere. Steps for the owner: docs/RELEASING.md.
#
# pull_request and workflow_dispatch with dry_run (the default) run the same verify and build
# steps and stop before anything is published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; publish nothing"
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - package.json
      - .github/scripts/release_check.py
      - tests/test_release_workflow.py
      - tests/test_release_check.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to a commit SHA, not a tag: a tag is mutable, and a moved
# `v4` would run code nobody reviewed with this repo's token. The comment names the release.
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
      pypi: ${{ steps.versions.outputs.pypi }}
      npm: ${{ steps.versions.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The tag names the PyPI version: v + pyproject.toml's version, as written there. npm is an
      # independent version line: package.json's version is published only if npm lacks it. A
      # release with nothing new for either registry fails. Publishing happens only for a
      # published release, or a manual run on a v* tag with dry_run unticked; everything else is
      # a dry run. Logic and tests: .github/scripts/release_check.py, tests/test_release_check.py.
      - name: Check tag and versions
        id: versions
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/release_check.py
      - run: npm install --no-package-lock --legacy-peer-deps
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Build and check both packages in a job that holds no OIDC permission; the publishing jobs
  # below only upload what was built and checked here (PyPI) or pack the same tag (npm).
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: npm publish dry run
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then tag=beta; else tag=latest; fi
          npm publish --dry-run --tag "$tag"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [verify, build]
    if: needs.verify.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tool-guardian/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  npm:
    needs: [verify, build]
    if: needs.verify.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1 && npm --version
      - name: Publish
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
      # A prerelease is also what `latest` serves (this package has only ever shipped betas).
      # Moving a dist-tag by OIDC needs "Allow npm dist-tag" on the npm trusted publisher; until
      # it is on, this step fails AFTER the package is published -- see docs/RELEASING.md.
      - name: Point latest at the prerelease
        if: needs.verify.outputs.prerelease == 'true'
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm_version }}
        run: |
          npm dist-tag add "dsh-tool-guardian@$NPM_VERSION" latest || {
            echo "::error::published dsh-tool-guardian@$NPM_VERSION under beta, but could not move latest; see docs/RELEASING.md (Allow npm dist-tag)"
            exit 1
          }
